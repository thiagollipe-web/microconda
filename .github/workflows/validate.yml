name: Validate MicroConda Game Studio

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          required = ['id="editor"', 'id="files"', 'id="out"', 'id="cmd"', 'id="run"', 'id="download"', 'function buildDocument', 'function exportHtml', 'localStorage', 'iframe']
          missing = [x for x in required if x not in html]
          forbidden = ["pyodide", "pygame", "micropip", "loadPyodide", "runPythonAsync", "pygame-ce", "space_invaders_ascii.py", "pygame_nave.py"]
          found = [x for x in forbidden if x.lower() in html.lower()]
          if missing: raise SystemExit(f"Missing required markers: {missing}")
          if found: raise SystemExit(f"Legacy runtime references: {found}")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1 and x not in {"game"}})
          if duplicates: raise SystemExit(f"Duplicate HTML ids: {duplicates}")
          if 'download=" + base + ".html' not in html and 'a.download=base+".html"' not in html: raise SystemExit("Single HTML export missing")
          if "srcdoc" not in html: raise SystemExit("Preview iframe missing")
          if "pointer" not in html: raise SystemExit("Pointer/touch support missing")
          print("Architecture checks: OK")
          PY

      - name: Validate JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1].trim()).filter(Boolean);
          if (scripts.length !== 1) throw new Error("Expected one inline application script");
          new Function(scripts[0]);
          console.log("JavaScript syntax: OK");
          NODE

      - name: Validate exported document logic
        run: |
          node <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          for(const marker of ["function buildDocument","function exportHtml","new Blob([doc]","a.download=base+\".html\"","<style>","<script>"]) {
            if(!html.includes(marker)) throw new Error("Missing export marker: "+marker);
          }
          if(/\.zip|\.py|pyodide|pygame/i.test(html)) throw new Error("Legacy export/runtime reference detected");
          console.log("Export checks: OK");
          NODE

  browser-smoke:
    runs-on: ubuntu-latest
    needs: static-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/microconda-http.log 2>&1 & echo $! >/tmp/microconda-http.pid
      - run: node tests/browser-smoke.mjs
      - if: failure()
        run: cat /tmp/microconda-http.log || true
      - if: always()
        run: kill $(cat /tmp/microconda-http.pid) 2>/dev/null || true
