name: Validate MicroConda

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser shell and legacy PWA cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          required = ["id=\"editor\"", "id=\"out\"", "id=\"cmd\"", "gameCanvas", "executeGame", "loadPyodide", "localStorage"]
          missing = [item for item in required if item not in html]
          forbidden = ["manifest.webmanifest", "Instalar PWA", "beforeinstallprompt", 'register("./sw.js")']
          present_forbidden = [item for item in forbidden if item in html]
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if missing: raise SystemExit(f"Missing required markers: {missing}")
          if present_forbidden: raise SystemExit(f"Obsolete PWA markers still present: {present_forbidden}")
          if duplicates: raise SystemExit(f"Duplicate HTML ids: {duplicates}")
          if "drawImage(source.canvas" in html: raise SystemExit("Legacy visual-copy popup implementation detected")
          if "gameTargetCanvas=popupCanvas" not in html: raise SystemExit("Popup is not bound as the active game canvas")
          if "forwardKeyboard" not in html: raise SystemExit("Popup keyboard bridge is missing")
          print("HTML architecture checks: OK")
          PY

      - name: Validate JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1].trim()).filter(Boolean);
          if (scripts.length !== 1) throw new Error(`Expected one inline script, found ${scripts.length}`);
          new Function(scripts[0]);
          console.log("JavaScript syntax: OK");
          NODE

      - name: Validate every Python source
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(Path(".").glob("*.py"))
          if not files: raise SystemExit("No Python source files found")
          for path in files:
              py_compile.compile(str(path), doraise=True)
              print(f"Python syntax OK: {path}")
          PY

      - name: Validate embedded examples
        run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          for (const marker of ['"06 — Space Invaders ASCII.py":"', '"07 — Nave Pygame.py"']) {
            if (!html.includes(marker)) throw new Error(`Embedded example marker missing: ${marker}`);
          }
          const marker = '"06 — Space Invaders ASCII.py":"';
          const start = html.indexOf(marker);
          const end = html.indexOf('"};\nlet project', start);
          if (start < 0 || end < 0) throw new Error("Embedded Space Invaders example not found");
          const encoded = html.slice(start + marker.length, end);
          fs.writeFileSync("/tmp/embedded_space_invaders.py", JSON.parse('"' + encoded + '"'), "utf8");
          NODE
          python -m py_compile /tmp/embedded_space_invaders.py

  browser-smoke:
    runs-on: ubuntu-latest
    needs: static-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/microconda-http.log 2>&1 &
          echo $! > /tmp/microconda-http.pid

      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs

      - name: Server log on failure
        if: failure()
        run: cat /tmp/microconda-http.log || true

      - name: Stop local server
        if: always()
        run: kill $(cat /tmp/microconda-http.pid) 2>/dev/null || true
