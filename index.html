<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>MicroConda — Python no navegador</title>
<style>
:root{--bg:#070b14;--panel:#0d1424;--panel2:#111a2d;--line:#22304a;--text:#e8eef8;--muted:#8ea0ba;--accent:#62d7ff;--ok:#6ee7a2;--warn:#ffd166;--danger:#ff7182}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#15213a 0,#070b14 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.88);backdrop-filter:blur(12px)}
.logo{font-weight:800;letter-spacing:.3px}.logo span{color:var(--accent)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 12px var(--warn)}.dot.ready{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:650}button:hover{border-color:#3a557d;background:#17233b}button.primary{background:#12374a;border-color:#2c7f9e;color:#dff8ff}button.danger{color:#ffb1bc}
.main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:12px;padding:12px}.panel{min-height:0;border:1px solid var(--line);background:rgba(13,20,36,.9);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.bar{height:46px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);gap:8px;color:var(--muted);font-size:13px}.bar strong{color:var(--text)}.spacer{margin-left:auto}.editor-wrap{min-height:0;flex:1;display:grid;grid-template-columns:48px 1fr;background:#080d18}.lines{padding:14px 8px;text-align:right;color:#42526d;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:none;overflow:hidden}.editor{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#dce8f7;padding:14px 16px;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto}.terminal{min-height:0;flex:1;display:flex;flex-direction:column;background:#050912}.output{min-height:0;flex:1;overflow:auto;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.entry{border-top:1px solid var(--line);display:flex;align-items:center;padding:10px 12px;gap:8px}.prompt{color:var(--accent);font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace}.cmd{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.hint{padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.welcome{color:#a9bbd5}.ok{color:var(--ok)}.err{color:var(--danger)}.info{color:var(--accent)}.footer{padding:7px 14px;color:#647793;font-size:11px;text-align:center}
@media(max-width:850px){body{overflow:auto;height:auto;min-height:100vh}.app{min-height:100vh}.main{grid-template-columns:1fr;height:auto}.panel{height:58vh;min-height:420px}.top{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px}.actions{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">Micro<span>Conda</span> Python Terminal</div>
  <div class="status"><i id="dot" class="dot"></i><span id="status">Inicializando Python…</span></div>
  <div class="actions">
    <button id="run" class="primary">▶ Executar</button>
    <button id="clear">Limpar terminal</button>
    <button id="save">Salvar .py</button>
    <button id="reset" class="danger">Reset Python</button>
  </div>
</header>
<main class="main">
<section class="panel">
  <div class="bar"><strong>main.py</strong><span>Editor Python</span><span class="spacer">Ctrl+Enter para executar</span></div>
  <div class="editor-wrap">
    <div id="lines" class="lines">1</div>
    <textarea id="editor" class="editor" spellcheck="false">print("Olá, MicroConda!")
nome = "Python"
for i in range(3):
    print(f"Executando {nome}: {i + 1}")

print("2 + 3 =", 2 + 3)</textarea>
  </div>
</section>
<section class="panel">
  <div class="bar"><strong>Terminal</strong><span>Python no navegador</span></div>
  <div id="output" class="output"></div>
  <div class="entry"><span class="prompt">>>></span><input id="cmd" class="cmd" autocomplete="off" placeholder="Digite uma expressão Python ou: help"></div>
  <div class="hint">Comandos: <b>help</b>, <b>clear</b>, <b>version</b>. Pacotes: use <b>install("numpy")</b>.</div>
</section>
</main>
<div class="footer">MicroConda Browser Terminal · CPython via WebAssembly/Pyodide · seus códigos permanecem no navegador</div>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
(() => {
  const editor=document.getElementById("editor"), output=document.getElementById("output");
  const status=document.getElementById("status"), dot=document.getElementById("dot");
  const run=document.getElementById("run"), clear=document.getElementById("clear");
  const save=document.getElementById("save"), reset=document.getElementById("reset");
  const cmd=document.getElementById("cmd"), lines=document.getElementById("lines");
  let pyodide=null, loading=null, history=[], historyIndex=-1;

  const write=(text,kind="")=>{
    const el=document.createElement("div"); el.className=kind; el.textContent=text;
    output.appendChild(el); output.scrollTop=output.scrollHeight;
  };
  const syncLines=()=>{
    const n=editor.value.split("\n").length;
    lines.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");
  };
  const setStatus=(text,ready=false)=>{
    status.textContent=text; dot.classList.toggle("ready",ready);
  };
  const init=async()=>{
    if(loading) return loading;
    loading=(async()=>{
      setStatus("Carregando Python…");
      pyodide=await loadPyodide();
      pyodide.setStdout({batched:s=>write(s)});
      pyodide.setStderr({batched:s=>write(s,"err")});
      pyodide.globals.set("install", async name => {
        write("Instalando pacote: "+name,"info");
        await pyodide.loadPackage(["micropip"]);
        await pyodide.runPythonAsync("import micropip; await micropip.install("+JSON.stringify(name)+")");
        write("Pacote instalado: "+name,"ok");
      });
      setStatus("Python pronto",true);
      write("MicroConda Terminal pronto.","ok");
      write("Python "+pyodide.runPython("import sys; sys.version.split()[0]")+" · WebAssembly","info");
      return pyodide;
    })().catch(err=>{setStatus("Erro ao carregar Python");write(String(err),"err");throw err});
    return loading;
  };
  const execute=async(code)=>{
    if(!code.trim()) return;
    const engine=await init();
    write(">>> "+code,"info");
    try{
      const result=await engine.runPythonAsync(code);
      if(result!==undefined && result!==null){
        const text=typeof result==="string"?result:JSON.stringify(result);
        if(text) write(text);
      }
    }catch(err){write(String(err),"err")}
  };
  run.onclick=()=>execute(editor.value);
  clear.onclick=()=>{output.textContent=""};
  reset.onclick=async()=>{pyodide=null;loading=null;output.textContent="";setStatus("Reiniciando…");await init()};
  save.onclick=()=>{
    const blob=new Blob([editor.value],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="main.py";a.click();URL.revokeObjectURL(a.href);
  };
  editor.addEventListener("input",()=>{syncLines();localStorage.setItem("microconda-python-code",editor.value)});
  editor.addEventListener("scroll",()=>{lines.scrollTop=editor.scrollTop});
  editor.addEventListener("keydown",e=>{
    if(e.key==="Tab"){e.preventDefault();const s=editor.selectionStart;editor.value=editor.value.slice(0,s)+"    "+editor.value.slice(editor.selectionEnd);editor.selectionStart=editor.selectionEnd=s+4;syncLines()}
    if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();execute(editor.value)}
  });
  cmd.addEventListener("keydown",async e=>{
    if(e.key==="ArrowUp"){e.preventDefault();if(history.length){historyIndex=Math.max(0,historyIndex-1);cmd.value=history[historyIndex]}} 
    if(e.key==="ArrowDown"){e.preventDefault();if(history.length){historyIndex=Math.min(history.length,historyIndex+1);cmd.value=history[historyIndex]||""}}
    if(e.key!=="Enter") return;
    const value=cmd.value.trim();cmd.value="";
    if(!value)return;
    history.push(value);historyIndex=history.length;
    if(value==="clear"){clear.click();return}
    if(value==="help"){write("Digite Python diretamente. Exemplos: print(2+2), import math; math.sqrt(25), [x*x for x in range(5)]","info");return}
    if(value==="version"){await init();write(pyodide.runPython("import sys; sys.version"),"info");return}
    await execute(value);
  });
  const saved=localStorage.getItem("microconda-python-code");if(saved)editor.value=saved;
  syncLines();init();
})();
</script>
</body>
</html>
